# hubidubios Hyprland keybinds (Phase 8). Sourced from the Omarchy Hyprland config:
#   source = /etc/hubidubios/hypr/hubidubios-keybinds.conf
#
# Native quick-capture — Super+Shift+Space opens the capture prompt anywhere.
bind = SUPER SHIFT, Space, exec, /usr/local/bin/hubidubios-capture-gui

# Jump to the next-actions panel (a Quickshell popup) — Super+Shift+N.
bind = SUPER SHIFT, N, exec, /usr/local/bin/hubidubios-next-panel
