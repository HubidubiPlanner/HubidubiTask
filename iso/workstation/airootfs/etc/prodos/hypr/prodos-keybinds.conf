# prodos Hyprland keybinds (Phase 8). Sourced from the Omarchy Hyprland config:
#   source = /etc/prodos/hypr/prodos-keybinds.conf
#
# Native quick-capture — Super+Shift+Space opens the capture prompt anywhere.
bind = SUPER SHIFT, Space, exec, /usr/local/bin/prodos-capture-gui

# Jump to the next-actions panel (a Quickshell popup) — Super+Shift+N.
bind = SUPER SHIFT, N, exec, /usr/local/bin/prodos-next-panel
