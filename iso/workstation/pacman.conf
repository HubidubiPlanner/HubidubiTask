# pacman.conf used during ISO build. Adds the prodos LAN repo so the profile's
# prodos-* packages resolve. The repo is a signed local repo (PLAN.md Phase 3);
# build.sh points $PRODOS_REPO at the built package directory.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The prodos repo. During CI this is a file:// path to the freshly built
# packages; on a running workstation it is served over the LAN. Package
# signatures use the project key, so the archive stays trustworthy off-cloud.
[prodos]
SigLevel = Optional TrustAll
Server = file:///build/prodos-repo
