[project]
name = "prodos-agent"
version = "0.1.0"
description = "prodos agent: constrained skill-dispatch loop over a local llama.cpp endpoint."
requires-python = ">=3.12"
dependencies = [
    "prodos-vault",
    "prodos-plugin-host",
    "jsonschema>=4.0",
]

[project.scripts]
prodos-agent = "prodos_agent.cli:main"

[tool.uv.sources]
prodos-vault = { workspace = true }
prodos-plugin-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodos_agent"]
