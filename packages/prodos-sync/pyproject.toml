[project]
name = "prodos-sync"
version = "0.1.0"
description = "prodos change-feed API: entity-level sync over pinned TLS on the LAN."
requires-python = ">=3.12"
dependencies = [
    "prodos-vault",
]

[project.scripts]
prodos-sync = "prodos_sync.cli:main"

[tool.uv.sources]
prodos-vault = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodos_sync"]
