[project]
name = "prodos-sync"
version = "0.1.0"
description = "prodos change-feed API: entity-level sync over pinned TLS on the LAN."
requires-python = ">=3.12"
dependencies = [
    "prodos-vault",
]

# The agent proxy (/v1/agent/ask) activates only when prodos-agent is present;
# the server degrades to 501 without it, so it stays an optional extra.
[project.optional-dependencies]
agent = ["prodos-agent"]

[project.scripts]
prodos-sync = "prodos_sync.cli:main"

[tool.uv.sources]
prodos-vault = { workspace = true }
prodos-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodos_sync"]
