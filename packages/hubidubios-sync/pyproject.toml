[project]
name = "hubidubios-sync"
version = "0.1.0"
description = "hubidubios change-feed API: entity-level sync over pinned TLS on the LAN."
requires-python = ">=3.12"
dependencies = [
    "hubidubios-vault",
]

# The agent proxy (/v1/agent/ask) activates only when hubidubios-agent is present;
# the server degrades to 501 without it, so it stays an optional extra.
[project.optional-dependencies]
agent = ["hubidubios-agent"]

[project.scripts]
hubidubios-sync = "hubidubios_sync.cli:main"

[tool.uv.sources]
hubidubios-vault = { workspace = true }
hubidubios-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubidubios_sync"]
