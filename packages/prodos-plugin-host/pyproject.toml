[project]
name = "prodos-plugin-host"
version = "0.1.0"
description = "prodos plugin loader, skill sandbox (bwrap), and view bridge."
requires-python = ">=3.12"
dependencies = [
    "prodos-vault",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
prodos-plugins = "prodos_plugin_host.cli:main"

[tool.uv.sources]
prodos-vault = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodos_plugin_host"]
