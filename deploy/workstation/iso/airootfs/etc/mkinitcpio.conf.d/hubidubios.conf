# Custom mkinitcpio for the hubidubios live medium (PLAN.md Phase 7).
# archiso hooks build the live environment; block/keyboard/filesystems cover
# install to real hardware. Kept minimal — no proprietary early-KMS needed for
# the target (the integrated GPU uses amdgpu, loaded normally).
HOOKS=(base udev modconf archiso block filesystems keyboard)
COMPRESSION="zstd"
