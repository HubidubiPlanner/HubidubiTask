# hubidubios vault config, seeded into the image (Phase: plain hubidubios ISO).
# Points the agent at the local selfhostedai-agent OpenAI server by default.
# Edit endpoint / api_key to taste; HUBIDUBIOS_MODEL_ENDPOINT overrides at runtime.

[inference]
endpoint = "http://127.0.0.1:8081/v1/chat/completions"
model = "local"
# protocol = "openai"          # default: OpenAI-compatible wire format
# api_key = ""
# tls_fingerprint = ""

# To use your selfhostedai-agent over the LAN: its OpenAI server is loopback-only, so
# HubidubiOS talks to its ENCRYPTED API on :8443 (AES-256-GCM over an ECDH
# session). Uncomment and point at your box, then: hubidubios-agent status
# [inference]
# protocol = "selfhostedai"
# endpoint = "https://192.168.1.50:8443"
# model = "fast"

# Google Calendar — one-way, read-only pull into the vault (Phase 9). This is
# the ONLY sanctioned outbound in an otherwise no-cloud system, and it is OFF
# until you do BOTH of these:
#   1. Put your PRIVATE iCal address(es) below (Google Calendar → Settings →
#      "Secret address in iCal format"). Keep this file private — that URL is a
#      credential.
#   2. Open the firewall exception in /etc/nftables.conf (see the "Google
#      Calendar" block there).
# Then `hubidubios calendar pull` (or the hubidubios-gcal.timer, every 15 min)
# drops events into calendars/google/ and they sync to your phone like any other.
# [calendar]
# google_ics_urls = ["https://calendar.google.com/calendar/ical/…/basic.ics"]
