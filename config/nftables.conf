# prodos workstation firewall (PLAN.md Phase 2 — network lockdown).
# Ships in the base package; per-skill egress restriction arrives in Phase 3.
#
# Adjust `lan` to the actual LAN subnet before enabling:
#   systemctl enable --now nftables

define lan = 192.168.1.0/24

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        iif lo accept
        ct state invalid drop

        # ICMP/ICMPv6 kept for path MTU and neighbor discovery on the LAN
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } ip saddr $lan accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr $lan tcp dport 22 accept      # ssh
        ip saddr $lan tcp dport 5232 accept    # radicale (CalDAV)
        ip saddr $lan tcp dport 5233 accept    # prodos-sync
        ip saddr $lan udp dport 5353 accept    # mdns (avahi)
        ip saddr $lan tcp dport 22000 accept   # syncthing
        ip saddr $lan udp dport 22000 accept   # syncthing (QUIC)
        ip saddr $lan udp dport 21027 accept   # syncthing local discovery
        ip saddr $lan tcp dport 8080 accept    # llama.cpp (Phase 4)
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Host egress stays open: pacman -Syu still needs the internet.
    }
}
