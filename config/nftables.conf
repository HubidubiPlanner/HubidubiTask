# HubidubiOS workstation firewall (PLAN.md Phase 2 + Phase 8 egress lockdown).
# Ships in the base package.
#
# Phase 8: the workstation base is Omarchy, which ships cloud-capable apps
# (Chromium, its coding-agent widget). To keep "no cloud, ever" a firewall
# guarantee rather than a convention, the OUTPUT policy is now drop-by-default
# with a narrow allowlist: LAN, DNS, and the package mirrors. No app can reach
# an arbitrary cloud host. Loosen `update_mirrors` to your chosen mirror hosts,
# or run updates through a timed window that flips this policy.
#
# Adjust `lan` to the actual LAN subnet before enabling:
#   systemctl enable --now nftables

define lan = 192.168.1.0/24

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        iif lo accept
        ct state invalid drop

        # ICMP/ICMPv6 kept for path MTU and neighbor discovery on the LAN
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } ip saddr $lan accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr $lan tcp dport 22 accept      # ssh
        ip saddr $lan tcp dport 5232 accept    # radicale (CalDAV)
        ip saddr $lan tcp dport 5233 accept    # hubidubios-sync
        ip saddr $lan udp dport 5353 accept    # mdns (avahi)
        ip saddr $lan tcp dport 22000 accept   # syncthing
        ip saddr $lan udp dport 22000 accept   # syncthing (QUIC)
        ip saddr $lan udp dport 21027 accept   # syncthing local discovery
        ip saddr $lan tcp dport 8080 accept    # llama.cpp (Phase 4)
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        ct state established,related accept
        oif lo accept

        # LAN is fully reachable (sync, radicale, syncthing, inference, ssh).
        ip daddr $lan accept

        # DNS (needed to resolve mirrors) — to the LAN resolver or a set host.
        udp dport 53 ip daddr $lan accept
        tcp dport 53 ip daddr $lan accept

        # Package mirrors only. As shipped the box is fully offline except the
        # LAN, so a cloud-capable desktop app cannot phone home. To allow
        # `pacman -Syu`, add `define update_mirrors = { <ip>, ... }` beside the
        # `define lan` line at the top, then uncomment:
        #   ip daddr $update_mirrors tcp dport { 80, 443 } accept

        # Uncomment to log what the lockdown drops while tuning the allowlist:
        # log prefix "nft-output-drop " limit rate 5/minute
    }
}
