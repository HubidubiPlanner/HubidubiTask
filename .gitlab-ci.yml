# HubidubiTask CI: the app on Android, macOS and Linux.
#
# CI IS DISABLED FOR NOW: the workflow rule below prevents any pipeline. To
# turn it on, delete the `workflow` block. The macOS app is built on a Mac
# (jpackage builds only for the system it runs on), so it has no job here.
workflow:
  rules:
    - when: never

stages:
  - test
  - build

shared-and-desktop-tests:
  stage: test
  image: eclipse-temurin:17-jdk
  script:
    - cd src/apps
    - ./gradlew --no-daemon -Phubidubitask.desktopOnly=true :shared:test :desktop:test

android:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:34
  script:
    - cd src/apps
    - ./gradlew :android:assembleDebug :android:bundleRelease
  artifacts:
    paths:
      - src/apps/android/build/outputs/apk/debug/android-debug.apk
    expire_in: 1 week

linux-package:
  stage: build
  image: archlinux:latest
  # The Arch package needs the Linux app image, which needs a Docker host;
  # run distribution/arch/build.sh on a machine with Docker instead.
  when: manual
  script:
    - echo "Run distribution/arch/build.sh on a host with Docker."
