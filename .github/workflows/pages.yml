# The website on GitHub Pages, https://hubidubitask.github.io/HubidubiTask/:
# site/ put together and checked by deploy/website/2-site/assemble.sh. The Mac
# and Linux buttons link to the latest GitHub release, so the site carries no
# downloads. In Settings › Pages the source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - deploy/website/**
      - src/apps/gradle.properties
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: sh deploy/website/2-site/assemble.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deploy/website/2-site/out/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
