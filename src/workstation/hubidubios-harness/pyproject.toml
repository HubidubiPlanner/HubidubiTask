[project]
name = "hubidubios-harness"
version = "0.1.0"
description = "Serve Claude Code on this machine to the HubidubiOS phone and Mac apps."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hubidubios-harness = "hubidubios_harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubidubios_harness"]
