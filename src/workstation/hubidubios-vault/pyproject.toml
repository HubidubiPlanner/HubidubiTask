[project]
name = "hubidubios-vault"
version = "0.1.0"
description = "Vault core for hubidubios: entities, indexer, CLI. Files are the source of truth."
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "icalendar>=6.0",
]

[project.scripts]
hubidubios = "hubidubios_vault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubidubios_vault"]
