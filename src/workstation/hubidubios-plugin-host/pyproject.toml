[project]
name = "hubidubios-plugin-host"
version = "0.1.0"
description = "hubidubios plugin loader, skill sandbox (bwrap), and view bridge."
requires-python = ">=3.12"
dependencies = [
    "hubidubios-vault",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
hubidubios-plugins = "hubidubios_plugin_host.cli:main"

[tool.uv.sources]
hubidubios-vault = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubidubios_plugin_host"]
