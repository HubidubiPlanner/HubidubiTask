org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# The Homebrew JDK packages the Mac app fine; the plugin's vendor check is a caution, not a failure.
compose.desktop.packaging.checkJdkVendor=false

# The release: one version for Android, macOS and Linux. versionCode only
# ever goes up (Google Play refuses a code it has seen).
hubidubitask.version=3.2.0
hubidubitask.versionCode=18
